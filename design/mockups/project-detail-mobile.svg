<svg xmlns="http://www.w3.org/2000/svg" width="390" height="2740" viewBox="0 0 390 2740"><rect width="390" height="2740" fill="#eef1ec"/><rect x="0" y="0" width="390" height="64" fill="#eef1ec"/><line x1="0" y1="64" x2="390" y2="64" stroke="#bcc4bb" stroke-width="1"/><text x="20" y="40" font-family="'Instrument Serif', Georgia, serif" font-size="25" font-weight="400" fill="#1b2224" text-anchor="start" letter-spacing="0"><tspan x="20" dy="0">Atelier North</tspan></text><rect x="300" y="12" width="70" height="40" fill="none" stroke="#1b2224" stroke-width="1.5" rx="2"/><text x="335" y="38" font-family="'Hanken Grotesk Variable', 'Hanken Grotesk', system-ui, sans-serif" font-size="15" font-weight="600" fill="#1b2224" text-anchor="middle" letter-spacing="0"><tspan x="335" dy="0">Menu</tspan></text><text x="20" y="100" font-family="'Hanken Grotesk Variable', 'Hanken Grotesk', system-ui, sans-serif" font-size="14" font-weight="400" fill="#4a5658" text-anchor="start" letter-spacing="0"><tspan x="20" dy="0">Projects / Residential / Ridge Glasshouse</tspan></text><text x="20" y="170" font-family="'Instrument Serif', Georgia, serif" font-size="52" font-weight="400" fill="#1b2224" text-anchor="start" letter-spacing="-1"><tspan x="20" dy="0">Ridge Glasshouse</tspan></text><text x="20" y="210" font-family="'Hanken Grotesk Variable', 'Hanken Grotesk', system-ui, sans-serif" font-size="17" font-weight="400" fill="#2b3537" text-anchor="start" letter-spacing="0"><tspan x="20" dy="0">A long glazed house on a wind-swept</tspan><tspan x="20" dy="26.35">ridge, cooled by deep eaves and a</tspan><tspan x="20" dy="26.35">planted roof.</tspan></text><rect x="20" y="300" width="350" height="200" fill="none" stroke="#1b2224" stroke-width="1.5"/><text x="38" y="336" font-family="'Hanken Grotesk Variable', 'Hanken Grotesk', system-ui, sans-serif" font-size="13.5" font-weight="600" fill="#4a5658" text-anchor="start" letter-spacing="0"><tspan x="38" dy="0">Location</tspan></text><text x="38" y="370" font-family="'Instrument Serif', Georgia, serif" font-size="19" font-weight="400" fill="#1b2224" text-anchor="start" letter-spacing="0"><tspan x="38" dy="0">Bergen, Norway</tspan></text><line x1="195" y1="300" x2="195" y2="400" stroke="#1b2224" stroke-width="1.5"/><text x="213" y="336" font-family="'Hanken Grotesk Variable', 'Hanken Grotesk', system-ui, sans-serif" font-size="13.5" font-weight="600" fill="#4a5658" text-anchor="start" letter-spacing="0"><tspan x="213" dy="0">Year</tspan></text><text x="213" y="370" font-family="'Instrument Serif', Georgia, serif" font-size="19" font-weight="400" fill="#1b2224" text-anchor="start" letter-spacing="0"><tspan x="213" dy="0">2025</tspan></text><text x="38" y="436" font-family="'Hanken Grotesk Variable', 'Hanken Grotesk', system-ui, sans-serif" font-size="13.5" font-weight="600" fill="#4a5658" text-anchor="start" letter-spacing="0"><tspan x="38" dy="0">Area</tspan></text><text x="38" y="470" font-family="'Instrument Serif', Georgia, serif" font-size="19" font-weight="400" fill="#1b2224" text-anchor="start" letter-spacing="0"><tspan x="38" dy="0">3,200 sq ft</tspan></text><line x1="195" y1="400" x2="195" y2="500" stroke="#1b2224" stroke-width="1.5"/><text x="213" y="436" font-family="'Hanken Grotesk Variable', 'Hanken Grotesk', system-ui, sans-serif" font-size="13.5" font-weight="600" fill="#4a5658" text-anchor="start" letter-spacing="0"><tspan x="213" dy="0">Category</tspan></text><text x="213" y="470" font-family="'Instrument Serif', Georgia, serif" font-size="19" font-weight="400" fill="#1b2224" text-anchor="start" letter-spacing="0"><tspan x="213" dy="0">Residential</tspan></text><line x1="20" y1="400" x2="370" y2="400" stroke="#1b2224" stroke-width="1.5"/><rect x="20" y="540" width="350" height="260" fill="#cbd1ca"/><path d="M20 800 L132 675.2 L195 732.4 L258 649.2 L370 800 Z" fill="#aab3ab" opacity=".7"/><circle cx="90" cy="605" r="15.6" fill="#aab3ab" opacity=".8"/><text x="20" y="824" font-family="'Hanken Grotesk Variable', 'Hanken Grotesk', system-ui, sans-serif" font-size="14" font-weight="400" fill="#4a5658" text-anchor="start" letter-spacing="0"><tspan x="20" dy="0">Open image gallery (1 of 4)</tspan></text><rect x="20" y="840" width="165" height="120" fill="#cbd1ca"/><path d="M20 960 L72.80000000000001 902.4 L102.5 928.8 L132.2 890.4 L185 960 Z" fill="#aab3ab" opacity=".7"/><circle cx="53" cy="870" r="7.199999999999999" fill="#aab3ab" opacity=".8"/><rect x="195" y="840" width="165" height="120" fill="#cbd1ca"/><path d="M195 960 L247.8 902.4 L277.5 928.8 L307.2 890.4 L360 960 Z" fill="#aab3ab" opacity=".7"/><circle cx="228" cy="870" r="7.199999999999999" fill="#aab3ab" opacity=".8"/><text x="20" y="1030" font-family="'Instrument Serif', Georgia, serif" font-size="40" font-weight="400" fill="#1b2224" text-anchor="start" letter-spacing="0"><tspan x="20" dy="0">Brief</tspan></text><text x="20" y="1074" font-family="'Hanken Grotesk Variable', 'Hanken Grotesk', system-ui, sans-serif" font-size="17" font-weight="400" fill="#1b2224" text-anchor="start" letter-spacing="0"><tspan x="20" dy="0">The clients wanted a house that opened</tspan><tspan x="20" dy="26.35">to the valley without overheating in</tspan><tspan x="20" dy="26.35">summer or losing heat in winter, built</tspan><tspan x="20" dy="26.35">from materials that age well.</tspan></text><text x="20" y="1230" font-family="'Instrument Serif', Georgia, serif" font-size="40" font-weight="400" fill="#1b2224" text-anchor="start" letter-spacing="0"><tspan x="20" dy="0">Approach</tspan></text><text x="20" y="1274" font-family="'Hanken Grotesk Variable', 'Hanken Grotesk', system-ui, sans-serif" font-size="17" font-weight="400" fill="#1b2224" text-anchor="start" letter-spacing="0"><tspan x="20" dy="0">A single long bar with solid concrete</tspan><tspan x="20" dy="26.35">ends and a glazed spine. Deep eaves,</tspan><tspan x="20" dy="26.35">fixed timber louvres and a planted</tspan><tspan x="20" dy="26.35">roof reduce solar gain.</tspan></text><text x="20" y="1450" font-family="'Instrument Serif', Georgia, serif" font-size="28" font-weight="400" fill="#1b2224" text-anchor="start" letter-spacing="0"><tspan x="20" dy="0">Scope of work</tspan></text><text x="40" y="1490" font-family="'Hanken Grotesk Variable', 'Hanken Grotesk', system-ui, sans-serif" font-size="16" font-weight="400" fill="#1b2224" text-anchor="start" letter-spacing="0"><tspan x="40" dy="0">•  Architecture</tspan></text><text x="40" y="1520" font-family="'Hanken Grotesk Variable', 'Hanken Grotesk', system-ui, sans-serif" font-size="16" font-weight="400" fill="#1b2224" text-anchor="start" letter-spacing="0"><tspan x="40" dy="0">•  Landscape design</tspan></text><text x="40" y="1550" font-family="'Hanken Grotesk Variable', 'Hanken Grotesk', system-ui, sans-serif" font-size="16" font-weight="400" fill="#1b2224" text-anchor="start" letter-spacing="0"><tspan x="40" dy="0">•  Interior design</tspan></text><text x="40" y="1580" font-family="'Hanken Grotesk Variable', 'Hanken Grotesk', system-ui, sans-serif" font-size="16" font-weight="400" fill="#1b2224" text-anchor="start" letter-spacing="0"><tspan x="40" dy="0">•  Furniture selection</tspan></text><text x="20" y="1640" font-family="'Instrument Serif', Georgia, serif" font-size="36" font-weight="400" fill="#1b2224" text-anchor="start" letter-spacing="0"><tspan x="20" dy="0">Related projects</tspan></text><rect x="20" y="1670" width="350" height="220" fill="#cbd1ca"/><path d="M20 1890 L132 1784.4 L195 1832.8 L258 1762.4 L370 1890 Z" fill="#aab3ab" opacity=".7"/><circle cx="90" cy="1725" r="13.2" fill="#aab3ab" opacity=".8"/><text x="20" y="1930" font-family="'Instrument Serif', Georgia, serif" font-size="26" font-weight="400" fill="#1b2224" text-anchor="start" letter-spacing="0"><tspan x="20" dy="0">Harbour Loft</tspan></text><rect x="0" y="1990" width="390" height="280" fill="#25565c"/><text x="20" y="2080" font-family="'Instrument Serif', Georgia, serif" font-size="34" font-weight="400" 