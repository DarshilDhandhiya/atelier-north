400" fill="#5b1313" text-anchor="start" letter-spacing="0"><tspan x="62" dy="0">Email: Enter a valid email address.</tspan></text><text x="62" y="454" font-family="'Hanken Grotesk Variable', 'Hanken Grotesk', system-ui, sans-serif" font-size="14.5" font-weight="400" fill="#5b1313" text-anchor="start" letter-spacing="0"><tspan x="62" dy="0">Privacy: Please agree to the notice.</tspan></text><text x="44" y="526" font-family="'Hanken Grotesk Variable', 'Hanken Grotesk', system-ui, sans-serif" font-size="14" font-weight="600" fill="#1b2224" text-anchor="start" letter-spacing="0"><tspan x="44" dy="0">Your name</tspan></text><rect x="44" y="536" width="302" height="46" fill="#fbfcfa" stroke="#2b3537" stroke-width="1.5" rx="2"/><text x="58" y="565" font-family="'Hanken Grotesk Variable', 'Hanken Grotesk', system-ui, sans-serif" font-size="16" font-weight="400" fill="#1b2224" text-anchor="start" letter-spacing="0"><tspan x="58" dy="0">Ingrid Solheim</tspan></text><text x="44" y="606" font-family="'Hanken Grotesk Variable', 'Hanken Grotesk', system-ui, sans-serif" font-size="14" font-weight="600" fill="#1b2224" text-anchor="start" letter-spacing="0"><tspan x="44" dy="0">Email</tspan></text><rect x="44" y="616" width="302" height="46" fill="#fbfcfa" stroke="#9b2626" stroke-width="2" rx="2"/><text x="58" y="645" font-family="'Hanken Grotesk Variable', 'Hanken Grotesk', system-ui, sans-serif" font-size="16" font-weight="400" fill="#1b2224" text-anchor="start" letter-spacing="0"><tspan x="58" dy="0">ingrid@example</tspan></text><text x="44" y="686" font-family="'Hanken Grotesk Variable', 'Hanken Grotesk', system-ui, sans-serif" font-size="13.5" font-weight="500" fill="#9b2626" text-anchor="start" letter-spacing="0"><tspan x="44" dy="0">Enter a valid email address, like name@example.com.</tspan></text><text x="44" y="712" font-family="'Hanken Grotesk Variable', 'Hanken Grotesk', system-ui, sans-serif" font-size="14" font-weight="600" fill="#1b2224" text-anchor="start" letter-spac