e</tspan></text><text x="48" y="218" font-family="'Instrument Serif', Georgia, serif" font-size="112" font-weight="400" fill="#1b2224" text-anchor="start" letter-spacing="-1"><tspan x="48" dy="0">Ridge Glasshouse</tspan></text><text x="48" y="274" font-family="'Hanken Grotesk Variable', 'Hanken Grotesk', system-ui, sans-serif" font-size="22" font-weight="400" fill="#2b3537" text-anchor="start" letter-spacing="0"><tspan x="48" dy="0">A long glazed house on a wind-swept ridge, cooled by deep eaves and a</tspan><tspan x="48" dy="34.1">planted roof.</tspan></text><rect x="48" y="344" width="1344" height="96" fill="none" stroke="#1b2224" stroke-width="1.5"/><text x="66" y="380" font-family="'Hanken Grotesk Variable', 'Hanken Grotesk', system-ui, sans-serif" font-size="13.5" font-weight="600" fill="#4a5658" text-anchor="start" letter-spacing="0"><tspan x="66" dy="0">Location</tspan></text><text x="66" y="414" font-family="'Instrument Serif', Georgia, serif" font-size="24" font-weight="400" fill="#1b2224" text-anchor="start" letter-spacing="0"><tspan x="66" dy="0">Bergen, Norway</tspan></text><line x1="384" y1="344" x2="384" y2="440" stroke="#1b2224" stroke-width="1.5"/><text x="402" y="380" font-family="'Hanken Grotesk Variable', 'Hanken Grotesk', system-ui, sans-serif" font-size="13.5" font-weight="600" fill="#4a5658" text-anchor="start" letter-spacing="0"><tspan x="402" dy="0">Year</tspan></text><text x="402" y="414" font-family="'Instrument Serif', Georgia, serif" font-size="24" font-weight="400" fill="#1b2224" text-anchor="start" letter-spacing="0"><tspan x="402" dy="0">2025</tspan></text><line x1="720" y1="344" x2="720" y2="440" stroke="#1b2224" stroke-width="1.5"/><text x="738" y="380" font-family="'Hanken Grotesk Variable', 'Hanken Grotesk', system-ui, sans-serif" font-size="13.5" font-weight="600" fill="#4a5658" text-anchor="start" letter-spacing="0"><tspan x="738" dy="0">Area</tspan></text><text x="738" y="414" font-family="'Instrument Serif', Georgia, serif" font-size="24" font-weight="400" fill="#1b2224" text-anchor="start" letter-spacing="0"><tspan x="738" dy="0">3,200 sq ft</tspan></text><line x1="1056" y1="344" x2="1056" y2="440" stroke="#1b2224" stroke-width="1.5"/><text x="1074" y="380" font-family="'Hanken Grotesk Variable', 'Hanken Grotesk', system-ui, sans-serif" font-size="13.5" font-weight="600" fill="#4a5658" text-anchor="start" letter-spacing="0"><tspan x="1074" dy="0">Category</tspan></text><text x="1074" y="414" font-family="'Instrument Serif', Georgia, serif" font-size="24" font-weight="400" fill="#1b2224" text-anchor="start" letter-spacing="0"><tspan x="1074" dy="0">Residential</tspan></text><rect x="48" y="480" width="800" height="540" fill="#cbd1ca"/><path d="M48 1020 L304 760.8 L448 879.6 L592 706.8 L848 1020 Z" fill="#aab3ab" opacity=".7"/><circle cx="208" cy="615" r="32.4" fill="#aab3ab" opacity=".8"/><rect x="872" y="480" width="520" height="260" fill="#cbd1ca"/><path d="M872 740 L1038.4 615.2 L1132 672.4 L1225.6 589.2 L1392 740 Z" fill="#aab3ab" opacity=".7"/><circle cx="976" cy="545" r="15.6" fill="#aab3ab" opacity=".8"/><rect x="872" y="760" width="520" height="260" fill="#cbd1ca"/><path d="M872 1020 L1038.4 895.2 L1132 952.4 L1225.6 869.2 L1392 1020 Z" fill="#aab3ab" opacity=".7"/><circle cx="976" cy="825" r="15.6" fill="#aab3ab" opacity=".8"/><text x="48" y="1080" font-family="'Hanken Grotesk Variable', 'Hanken Grotesk', system-ui, sans-serif" font-size="14" font-weight="400" fill="#4a5658" text-anchor="start" letter-spacing="0"><tspan x="48" dy="0">Click any image to open the gallery. Arrow keys move between images, Escape closes.</tspan></text><text x="48" y="1160" font-family="'Instrument Serif', Georgia, serif" font-size="40" font-weight="400" fill="#1b2224" text-anchor="start" letter-spacing="0"><tspan x="48" dy="0">Brief</tspan></text><text x="48" y="1204" font-family="'Hanken Grotesk Variable', 'Hanken Grotesk', system-ui, sans-serif" font-size="17" font-weight="400" fill="#1b2224" text-anchor="start" letter-spacing="0"><tspan x="48" dy="0">The clients wanted a house that opened to the valley without</tspan><tspan x="48" dy="26.35">overheating in summer or losing heat in winter, built from</tspan><tspan x="48" dy="26.35">materials that age well.</tspan></text><text x="760" y="1160" font-family="'Instrument Serif', Georgia, serif" font-size="40" font-weight="400" fill="#1b2224" text-anchor="start" letter-spacing="0"><tspan x="760" dy="0">Approach</tspan></text><text x="760" y="1204" font-family="'Hanken Grotesk Variable', 'Hanken Grotesk', system-ui, sans-serif" font-size="17" font-weight="400" fill="#1b2224" text-anchor="start" letter-spacing="0"><tspan x="760" dy="0">A single long bar with solid concrete ends and a glazed</tspan><tspan x="760" dy="26.35">spine. Deep eaves, fixed timber louvres and a planted roof</tspan><tspan x="760" dy="26.35">reduce solar gain.</tspan></text><text x="48" y="1380" font-family="'Instrument Serif', Georgia, serif" font-size="28" font-weight="400" fill="#1b2224" text-anchor="start" letter-spacing="0"><tspan x="48" dy="0">Scope of work</tspan></text><text x="68" y="1420" font-family="'Hanken Grotesk Variable', 'Hanken Grotesk', system-ui, sans-serif" font-size="16" font-weight="400" fill="#1b2224" text-anchor="start" letter-spacing="0"><tspan x="68" dy="0">•  Architecture</tspan></text><text x="68" y="1450" font-family="'Hanken Grotesk Variable', 'Hanken Grotesk', system-ui, sans-serif" font-size="16" font-weight="400" fill="#1b2224" text-anchor="start" letter-spacing="0"><tspan x="68" dy="0">•  Landscape design</tspan></text><text x="68" y="1480" font-family="'Hanken Grotesk Variable', 'Hanken Grotesk', system-ui, sans-serif" font-size="16" font-weight="400" fill="#1b2224" text-anchor="start" letter-spacing="0"><tspan x="68" dy="0">•  Interior design</tspan></text><text x="68" y="1510" font-family="'Hanken Grotesk Variable', 'Hanken Grotesk', system-ui, sans-serif" font-size="16" font-weight="400" fill="#1b2224" text-anchor="start" letter-spacing="0"><tspan x="68" dy="0">•  Furniture selection</tspan></text><text x="48" y="1570" font-family="'Instrument Serif', Georgia, serif" font-size="48" font-weight="400" fill="#1b2224" text-anchor="start" letter-spacing="0"><tspan x="48" dy="0">Related projects</tspan></text><rect x="48" y="1600" width="424" height="290" fill="#cbd1ca"/><path d="M48 1890 L183.68 1750.8 L260 1814.6 L336.32 1721.8 L472 1890 Z" fill="#aab3ab" opacity=".7"/><circle cx="132.8" cy="1672.5" r="17.4" fill="#aab3ab" opacity=".8"/><text x="48" y="1930" font-family="'Instrument Serif', Georgia, serif" font-size="26" font-weight="400" fill="#1b2224" text-anchor="start" letter-spacing="0"><tspan x="48" dy="0">Harbour Loft</tspan></text><rect x="504" y="1600" width="424" height="290" fill="#cbd1ca"/><path d="M504 1890 L639.6800000000001 1750.8 L716 1814.6 L792.3199999999999 1721.8 L928 1890 Z" fill="#aab3ab" opacity=".7"/><circle cx="588.8" cy="1672.5" r="17.4" fill="#aab3ab" opacity=".8"/><text x="504" y="1930" font-family="'Instrument Serif', Georgia, serif" font-size="26" font-weight="400" fill="#1b2224" text-anchor="start" letter-spacing="0"><tspan x="504" dy="0">Birch Pavilion</tspan></text><rect x="960" y="1600" width="424" height="290" fill="#cbd1ca"/><path d="M960 1890 L1095.68 1750.8 L1172 1814.6 L1248.32 1721.8 L1384 1890 Z" fill="#aab3ab" opacity=".7"/><circle cx="1044.8" cy="1672.5" r="17.4" fill="#aab3ab" opacity=".8"/><text x="960" y="1930" font-family="'Instrument Serif', Georgia, serif" font-size="26" font-weight="400" fill="#1b2224" text-anchor="start" letter-spacing="0"><tspan x="960" dy="0">Stone House</tspan></text><rect x="0" y="2020" width="1440" height="240" fill="#25565c"/><text x="48" y="2110" font-family="'Instrument Serif', Georgia, serif" font-size="56" font-weight="400" fill="#fbfcfa" text-anchor="start" letter-spacing="0"><tspan x="48" dy="0">Planning something similar?</tspan></text><rect x="48" y="2170" width="278" height="48" fill="#fbfc